name: CI

on:
  push:
    branches: [main]

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
  BUN_VERSION: "1.3.1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect code changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: .github/scripts/detect-code-changes.sh "$BASE_SHA" "$HEAD_SHA"

  validate:
    name: Typecheck + lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Module boundary check
        run: bun run deps:check

      - name: Theme contrast check
        run: bun run test:theme-contrast

  # `bun test` has no --shard of its own, so scripts/test-shard.ts splits the
  # suite. This list is checked against it by scripts/test-shard.test.ts —
  # change one and the other fails.
  test:
    name: Test (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test suite
        env:
          SHARD: ${{ matrix.shard }}
        run: bun run test:shard "$SHARD" "4"

  build:
    name: Build compiled binary
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run build:bin

      - name: Verify binary starts
        run: dist/sentry-tui --help || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: sentry-tui-linux-binary
          path: dist/sentry-tui
          if-no-files-found: error
