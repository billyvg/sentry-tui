name: CI

on:
  push:
    branches: [main]

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect code changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: .github/scripts/detect-code-changes.sh "$BASE_SHA" "$HEAD_SHA"

  validate:
    name: Typecheck + lint + test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Module boundary check
        run: bun run deps:check

      - name: Theme contrast check
        run: bun run test:theme-contrast

      - name: Test suite
        run: bun test

  build:
    name: Build compiled binary
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run build:bin

      - name: Verify binary starts
        run: dist/sentry-tui --help || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: sentry-tui-linux-binary
          path: dist/sentry-tui
          if-no-files-found: error
