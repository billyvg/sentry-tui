name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/detect-code-changes.sh "$BASE_SHA" "$HEAD_SHA"

  # The required-checks ruleset on main names these jobs (and each test shard)
  # exactly. A job-level `if` would skip the whole matrix for a docs-only PR,
  # leaving the four expanded check names pending forever. Gating the steps
  # keeps every required job reporting under its real name while doing no work.
  validate:
    name: Typecheck + lint
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Set up Bun project
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-bun

      - name: Format check
        if: needs.changes.outputs.code == 'true'
        run: bun run format:check

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: bun run lint

      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: bun run typecheck

      - name: Module boundary check
        if: needs.changes.outputs.code == 'true'
        run: bun run deps:check

      - name: Theme contrast check
        if: needs.changes.outputs.code == 'true'
        run: bun run test:theme-contrast

  # `bun test` has no --shard of its own, so scripts/test-shard.ts splits the
  # suite. This list is checked against it by scripts/test-shard.test.ts —
  # change one and the other fails.
  test:
    name: Test (shard ${{ matrix.shard }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Set up Bun project
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-bun

      - name: Test suite
        if: needs.changes.outputs.code == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: bun run test:shard "$SHARD" "4"

  # After validate and every test shard, not alongside them: this job uploads an
  # artifact people can download and run, and one built off a red commit is
  # indistinguishable from one built off a green one. Costs a couple of minutes
  # of wall-clock on the happy path, and saves a runner on every red push.
  build:
    name: Build compiled binary
    needs: [changes, validate, test]
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun project
        uses: ./.github/actions/setup-bun

      - name: Build binary
        run: bun run build:bin

      - name: Verify binary starts
        run: dist/sentry-tui --help || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: sentry-tui-linux-binary
          path: dist/sentry-tui
          if-no-files-found: error
