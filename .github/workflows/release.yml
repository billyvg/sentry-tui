name: Release
run-name: ${{ github.event_name == 'repository_dispatch' && format('Release v{0} [{1}]', github.event.client_payload.version, github.event.client_payload.request_id) || github.ref_name }}

# Hand-pushed tags still start a release. `release:cut` instead dispatches the
# exact remote commit, lets this workflow validate it, then creates the same
# annotated tag before building. Either path must match `package.json`.
#
# Run it by hand first (workflow_dispatch, dry_run: true) to build and package
# everything without publishing anything.
on:
  push:
    tags: ["v*"]
  repository_dispatch:
    types: [release_cut]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package, but publish nothing"
        type: boolean
        default: true

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      release_sha: ${{ steps.version.outputs.release_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}

      - name: Resolve and check version
        id: version
        env:
          REF_NAME: ${{ github.event_name == 'repository_dispatch' && format('v{0}', github.event.client_payload.version) || github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' || github.event_name == 'repository_dispatch' }}
          RELEASE_SHA_INPUT: ${{ github.event.client_payload.sha }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_SHA_INPUT:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

          if [ "$IS_TAG" = "true" ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match package.json version $version"
              exit 1
            fi
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${DRY_RUN_INPUT:-true}" >> "$GITHUB_OUTPUT"
          fi

  # A release must not be able to ship code the suite rejects, however its
  # request got here. `main`'s CI covers the normal remote-cut path, but a
  # hand-pushed tag never touches it, so the gate belongs in this workflow.
  validate:
    name: Typecheck + lint
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Set up Bun project
        uses: ./.github/actions/setup-bun

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Module boundary check
        run: bun run deps:check

      - name: Theme contrast check
        run: bun run test:theme-contrast

  # `bun test` has no --shard of its own, so scripts/test-shard.ts splits the
  # suite. This list is checked against it by scripts/test-shard.test.ts —
  # change one and the other fails.
  test:
    name: Test (shard ${{ matrix.shard }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Set up Bun project
        uses: ./.github/actions/setup-bun

      - name: Test suite
        env:
          SHARD: ${{ matrix.shard }}
        run: bun run test:shard "$SHARD" "4"

  # `release:cut` dispatches this workflow without a tag so validation can fail
  # cleanly first. Its authenticated caller already made the version commit;
  # GITHUB_TOKEN only creates the tag, and therefore cannot recursively trigger
  # another Release run. Hand-pushed tags and dry runs have nothing to do here.
  tag:
    name: Create release tag
    needs: [verify, validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 0

      - name: Create annotated tag
        if: github.event_name == 'repository_dispatch'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

  build:
    name: Build ${{ matrix.target }}
    needs: [verify, validate, test, tag]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Kept in step with scripts/release-targets.ts by scripts/packaging.test.ts.
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Set up Bun project
        uses: ./.github/actions/setup-bun

      - name: Build binary
        run: bun run ./scripts/build-bin.ts --target ${{ matrix.target }}

      # Ad-hoc signature. arm64 macOS refuses to exec an unsigned binary, and a
      # binary that travelled through a tarball has no signature of its own.
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - --force dist/bin/${{ matrix.target }}/sentry-tui

      - name: Smoke test
        run: dist/bin/${{ matrix.target }}/sentry-tui --help

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/bin/${{ matrix.target }}/sentry-tui
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package release
    needs: [verify, build]
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ needs.verify.outputs.dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Set up Bun project
        uses: ./.github/actions/setup-bun

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          path: dist/bin

      - name: Archive binaries and checksums
        run: .github/scripts/package-release.sh

      - name: Assemble npm packages
        run: bun run build:npm --strict

      # A dry run has no publish job to hand this to, so it gets the longer
      # retention — this artifact is the whole point of running one. A real
      # release only needs it to survive long enough to reach the publish job.
      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            dist/release
            dist/npm
          retention-days: ${{ env.DRY_RUN == 'true' && 7 || 1 }}

  # Split from `package` so only this job — the one that actually ships
  # something — runs against the `production` environment. It keeps the
  # environment's protection rules and OIDC identity, but suppresses Actions'
  # automatic pre-publish deployment. A successful npm publish is recorded
  # explicitly below instead.
  publish:
    name: Publish
    needs: [verify, package]
    if: needs.verify.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    permissions:
      contents: write # create the GitHub Release
      deployments: write # record the successful npm deployment
      id-token: write # npm trusted publishing (OIDC), and provenance
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Download release bundle
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: dist

      # Trusted publishing needs npm 11.5.1+, and the runner image's npm is
      # whatever it happens to be. Pinning the upgrade here rather than
      # trusting the image keeps a release from turning on that lottery.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        env:
          # Fallback only. Where a package has a trusted publisher configured,
          # npm authenticates over OIDC and never reads this — which is the
          # whole point, since a token guarded by 2FA answers CI with EOTP.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: .github/scripts/publish-npm.sh

      # The environment still gates this job and scopes its OIDC token, but
      # `deployment: false` keeps GitHub Actions from opening a deployment
      # before npm has accepted the packages. Record the completed operation
      # through the Deployments API only after the publish script succeeds.
      - name: Create GitHub deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deployment_id="$(
            gh api \
              --method POST \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/deployments" \
              --field "ref=v${VERSION}" \
              --field "environment=production" \
              --field "description=sentry-tui v${VERSION} published to npm" \
              --field "auto_merge=false" \
              --field "required_contexts[]" \
              --field "transient_environment=false" \
              --field "production_environment=true" \
              --jq ".id"
          )"

          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            --field "state=success" \
            --field "environment=production" \
            --field "environment_url=https://www.npmjs.com/package/sentry-tui/v/${VERSION}" \
            --field "log_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --field "description=Published sentry-tui v${VERSION} to npm" \
            --silent

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${VERSION}" \
            --generate-notes \
            dist/release/*
