name: Release

# Tag-driven: `git tag -a v0.1.0 -m v0.1.0 && git push origin v0.1.0`. The tag must match
# `version` in package.json — the first job fails the run otherwise.
#
# Run it by hand first (workflow_dispatch, dry_run: true) to build and package
# everything without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package, but publish nothing"
        type: boolean
        default: true

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
  BUN_VERSION: "1.3.1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve and check version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$IS_TAG" = "true" ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match package.json version $version"
              exit 1
            fi
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${DRY_RUN_INPUT:-true}" >> "$GITHUB_OUTPUT"
          fi

  # A release must not be able to ship code the suite rejects, however the tag
  # got here. `main`'s CI covers the normal path, but a hand-pushed tag never
  # touches it, so the gate belongs in the workflow that publishes.
  test:
    name: Typecheck + lint + test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format, lint, typecheck, boundaries, tests
        run: bun run check

  build:
    name: Build ${{ matrix.target }}
    needs: [verify, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Kept in step with scripts/release-targets.ts by scripts/packaging.test.ts.
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run ./scripts/build-bin.ts --target ${{ matrix.target }}

      # Ad-hoc signature. arm64 macOS refuses to exec an unsigned binary, and a
      # binary that travelled through a tarball has no signature of its own.
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - --force dist/bin/${{ matrix.target }}/sentry-tui

      - name: Smoke test
        run: dist/bin/${{ matrix.target }}/sentry-tui --help

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/bin/${{ matrix.target }}/sentry-tui
          if-no-files-found: error
          retention-days: 7

  release:
    name: Package and publish
    needs: [verify, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing (OIDC), and provenance
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DRY_RUN: ${{ needs.verify.outputs.dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          path: dist/bin

      - name: Archive binaries and checksums
        run: .github/scripts/package-release.sh

      - name: Assemble npm packages
        run: bun run build:npm --strict

      # Trusted publishing needs npm 11.5.1+, and the runner image's npm is
      # whatever it happens to be. Pinning the upgrade here rather than
      # trusting the image keeps a release from turning on that lottery.
      - name: Upgrade npm for trusted publishing
        if: env.DRY_RUN != 'true'
        run: npm install -g npm@latest

      - name: Publish to npm
        if: env.DRY_RUN != 'true'
        env:
          # Fallback only. Where a package has a trusted publisher configured,
          # npm authenticates over OIDC and never reads this — which is the
          # whole point, since a token guarded by 2FA answers CI with EOTP.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: .github/scripts/publish-npm.sh

      - name: Create GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${VERSION}" \
            --generate-notes \
            dist/release/*

      - name: Upload release bundle (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            dist/release
            dist/npm
          retention-days: 7
