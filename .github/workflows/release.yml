name: Release
run-name: ${{ github.event_name == 'repository_dispatch' && format('Release {0} [{1}]', github.event.client_payload.components, github.event.client_payload.request_id) || github.ref_name }}

# Hand-pushed tags still start a release. `release:cut` instead dispatches the
# exact remote commit, lets this workflow validate it, then creates the same
# component tags before building. Either path must match `release.json`.
#
# Run it by hand first (workflow_dispatch, dry_run: true) to build and package
# everything without publishing anything.
on:
  push:
    tags: ["host-v*", "app-v*"]
  repository_dispatch:
    types: [release_cut]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package, but publish nothing"
        type: boolean
        default: true
      components:
        description: "Release components to build"
        type: choice
        options: [all, host, app]
        default: all

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release plan
    runs-on: ubuntu-latest
    outputs:
      host_version: ${{ steps.version.outputs.host_version }}
      app_version: ${{ steps.version.outputs.app_version }}
      release_host: ${{ steps.version.outputs.release_host }}
      release_app: ${{ steps.version.outputs.release_app }}
      components: ${{ steps.version.outputs.components }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      release_sha: ${{ steps.version.outputs.release_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}

      - name: Resolve and check version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          COMPONENTS_INPUT: ${{ github.event.client_payload.components || inputs.components || 'all' }}
          HOST_VERSION_INPUT: ${{ github.event.client_payload.host_version }}
          APP_VERSION_INPUT: ${{ github.event.client_payload.app_version }}
          RELEASE_SHA_INPUT: ${{ github.event.client_payload.sha }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          host_version="$(node -p "require('./release.json').host")"
          app_version="$(node -p "require('./release.json').app")"
          release_host=false
          release_app=false

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            [ "$HOST_VERSION_INPUT" = "$host_version" ] || {
              echo "::error::requested host $HOST_VERSION_INPUT does not match release.json $host_version"
              exit 1
            }
            [ "$APP_VERSION_INPUT" = "$app_version" ] || {
              echo "::error::requested app $APP_VERSION_INPUT does not match release.json $app_version"
              exit 1
            }
          elif [ "$EVENT_NAME" = "push" ]; then
            case "$REF_NAME" in
              host-v*)
                COMPONENTS_INPUT=host
                [ "$REF_NAME" = "host-v$host_version" ] || {
                  echo "::error::tag $REF_NAME does not match host v$host_version"
                  exit 1
                }
                ;;
              app-v*)
                COMPONENTS_INPUT=app
                [ "$REF_NAME" = "app-v$app_version" ] || {
                  echo "::error::tag $REF_NAME does not match app v$app_version"
                  exit 1
                }
                ;;
            esac
          fi

          case ",$COMPONENTS_INPUT," in *,host,*|*,all,*) release_host=true ;; esac
          case ",$COMPONENTS_INPUT," in *,app,*|*,all,*) release_app=true ;; esac
          if [ "$release_host" != true ] && [ "$release_app" != true ]; then
            echo "::error::components must be host, app, host,app, or all"
            exit 1
          fi

          components=""
          if [ "$release_host" = true ]; then components=host; fi
          if [ "$release_app" = true ]; then
            [ -n "$components" ] && components="$components,app" || components=app
          fi
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "repository_dispatch" ]; then
            dry_run=false
          else
            dry_run="${DRY_RUN_INPUT:-true}"
          fi

          {
            echo "host_version=$host_version"
            echo "app_version=$app_version"
            echo "release_host=$release_host"
            echo "release_app=$release_app"
            echo "components=$components"
            echo "release_sha=${RELEASE_SHA_INPUT:-$GITHUB_SHA}"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

  # A release must not be able to ship code the suite rejects, however its
  # request got here. `main`'s CI covers the normal remote-cut path, but a
  # hand-pushed tag never touches it, so the gate belongs in this workflow.
  validate:
    name: Typecheck + lint
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Set up Bun project
        uses: ./.github/actions/setup-bun

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Module boundary check
        run: bun run deps:check

      - name: Theme contrast check
        run: bun run test:theme-contrast

  # `bun test` has no --shard of its own, so scripts/test-shard.ts splits the
  # suite. This list is checked against it by scripts/test-shard.test.ts —
  # change one and the other fails.
  test:
    name: Test (shard ${{ matrix.shard }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Set up Bun project
        uses: ./.github/actions/setup-bun

      - name: Test suite
        env:
          SHARD: ${{ matrix.shard }}
        run: bun run test:shard "$SHARD" "4"

  # `release:cut` dispatches this workflow without a tag so validation can fail
  # cleanly first. Its authenticated caller already made the version commit;
  # GITHUB_TOKEN only creates the component tags, and therefore cannot recursively trigger
  # another Release run. Hand-pushed tags and dry runs have nothing to do here.
  tag:
    name: Create release tag
    needs: [verify, validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 0

      - name: Create annotated tag
        if: github.event_name == 'repository_dispatch'
        env:
          HOST_VERSION: ${{ needs.verify.outputs.host_version }}
          APP_VERSION: ${{ needs.verify.outputs.app_version }}
          RELEASE_HOST: ${{ needs.verify.outputs.release_host }}
          RELEASE_APP: ${{ needs.verify.outputs.release_app }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$RELEASE_HOST" = true ]; then
            git tag -a "host-v${HOST_VERSION}" -m "host v${HOST_VERSION}"
            git push origin "host-v${HOST_VERSION}"
          fi
          if [ "$RELEASE_APP" = true ]; then
            git tag -a "app-v${APP_VERSION}" -m "app v${APP_VERSION}"
            git push origin "app-v${APP_VERSION}"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [verify, validate, test, tag]
    if: needs.verify.outputs.release_host == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Kept in step with scripts/release-targets.ts by scripts/packaging.test.ts.
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Set up Bun project
        uses: ./.github/actions/setup-bun

      - name: Build binary
        run: bun run ./scripts/build-bin.ts --target ${{ matrix.target }}

      # Ad-hoc signature. arm64 macOS refuses to exec an unsigned binary, and a
      # binary that travelled through a tarball has no signature of its own.
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - --force dist/bin/${{ matrix.target }}/sentry-tui

      - name: Smoke test
        run: dist/bin/${{ matrix.target }}/sentry-tui --help

      - name: Smoke test runtime payload loading
        run: |
          bun run build:app
          SENTRY_TUI_VERIFY_PAYLOAD="$PWD/dist/app/app.mjs" \
            dist/bin/${{ matrix.target }}/sentry-tui

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/bin/${{ matrix.target }}/sentry-tui
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package release
    needs: [verify, validate, test, tag, build]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.validate.result == 'success' &&
      needs.test.result == 'success' &&
      needs.tag.result == 'success' &&
      (needs.verify.outputs.release_host != 'true' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ needs.verify.outputs.dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Set up Bun project
        uses: ./.github/actions/setup-bun

      - name: Download binaries
        if: needs.verify.outputs.release_host == 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist/bin

      - name: Build app payload
        run: bun run build:app

      - name: Archive binaries and checksums
        if: needs.verify.outputs.release_host == 'true'
        run: .github/scripts/package-release.sh

      - name: Assemble npm packages
        env:
          RELEASE_HOST: ${{ needs.verify.outputs.release_host }}
          RELEASE_APP: ${{ needs.verify.outputs.release_app }}
        run: |
          if [ "$RELEASE_HOST" = true ] && [ "$RELEASE_APP" = true ]; then
            bun run build:npm --component all --strict
          elif [ "$RELEASE_HOST" = true ]; then
            bun run build:npm --component host --strict
          else
            bun run build:npm --component app
          fi

      # A dry run has no publish job to hand this to, so it gets the longer
      # retention — this artifact is the whole point of running one. A real
      # release only needs it to survive long enough to reach the publish job.
      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            dist/release
            dist/npm
          retention-days: ${{ env.DRY_RUN == 'true' && 7 || 1 }}

  # Split from `package` so only this job — the one that actually ships
  # something — runs against the `production` environment. It keeps the
  # environment's protection rules and OIDC identity, but suppresses Actions'
  # automatic pre-publish deployment. A successful npm publish is recorded
  # explicitly below instead.
  publish:
    name: Publish
    needs: [verify, package]
    if: needs.verify.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    permissions:
      contents: write # create the GitHub Release
      deployments: write # record the successful npm deployment
      id-token: write # npm trusted publishing (OIDC), and provenance
    env:
      HOST_VERSION: ${{ needs.verify.outputs.host_version }}
      APP_VERSION: ${{ needs.verify.outputs.app_version }}
      RELEASE_HOST: ${{ needs.verify.outputs.release_host }}
      RELEASE_APP: ${{ needs.verify.outputs.release_app }}
      COMPONENTS: ${{ needs.verify.outputs.components }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: dist

      - name: Set up Bun
        if: needs.verify.outputs.release_app == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # Debug IDs identify the independently versioned payload without tying it
      # to the host's Sentry release. Upload before npm so the artifact bundle
      # is ready before the first event from the new payload can arrive.
      - name: Upload app source maps to Sentry
        if: needs.verify.outputs.release_app == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: sentry
          SENTRY_PROJECT: sentry-tui
        run: >-
          bunx @sentry/cli@3.6.2 sourcemaps upload
          --strict --validate --wait
          dist/npm/billyvg-sentry-tui-app/app

      # Trusted publishing needs npm 11.5.1+, and the runner image's npm is
      # whatever it happens to be. Pinning the upgrade here rather than
      # trusting the image keeps a release from turning on that lottery.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        env:
          # Fallback only. Where a package has a trusted publisher configured,
          # npm authenticates over OIDC and never reads this — which is the
          # whole point, since a token guarded by 2FA answers CI with EOTP.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: .github/scripts/publish-npm.sh

      # The environment still gates this job and scopes its OIDC token, but
      # `deployment: false` keeps GitHub Actions from opening a deployment
      # before npm has accepted the packages. Record the completed operation
      # through the Deployments API only after the publish script succeeds.
      - name: Create GitHub deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RELEASE_HOST" = true ]; then
            release_ref="host-v${HOST_VERSION}"
            release_url="https://www.npmjs.com/package/sentry-tui/v/${HOST_VERSION}"
          else
            release_ref="app-v${APP_VERSION}"
            release_url="https://www.npmjs.com/package/@billyvg/sentry-tui-app/v/${APP_VERSION}"
          fi
          deployment_id="$(
            gh api \
              --method POST \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/deployments" \
              --field "ref=${release_ref}" \
              --field "environment=production" \
              --field "description=sentry-tui ${COMPONENTS} published to npm" \
              --field "auto_merge=false" \
              --field "required_contexts[]" \
              --field "transient_environment=false" \
              --field "production_environment=true" \
              --jq ".id"
          )"

          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            --field "state=success" \
            --field "environment=production" \
            --field "environment_url=${release_url}" \
            --field "log_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --field "description=Published sentry-tui ${COMPONENTS} to npm" \
            --silent

      - name: Create GitHub Release
        if: needs.verify.outputs.release_host == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "host-v${HOST_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Runtime host v${HOST_VERSION}" \
            --generate-notes \
            dist/release/*
