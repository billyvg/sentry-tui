name: Pull Request

on:
  pull_request:

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
  BUN_VERSION: "1.3.1"

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/detect-code-changes.sh "$BASE_SHA" "$HEAD_SHA"

  # The required-checks ruleset on main names these jobs (and each test
  # shard) exactly. A job-level `if` would skip the whole job — including its
  # matrix — for a docs-only PR, so only the unexpanded "Test (shard
  # ${{ matrix.shard }})" name would ever report, and the four required
  # "Test (shard N)" contexts would sit pending forever. Gating every step
  # instead keeps the job (and matrix) running, and reporting under its real
  # name, while doing no real work.
  validate:
    name: Typecheck + lint
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Set up Bun
        if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Format check
        if: needs.changes.outputs.code == 'true'
        run: bun run format:check

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: bun run lint

      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: bun run typecheck

      - name: Module boundary check
        if: needs.changes.outputs.code == 'true'
        run: bun run deps:check

      - name: Theme contrast check
        if: needs.changes.outputs.code == 'true'
        run: bun run test:theme-contrast

  # `bun test` has no --shard of its own, so scripts/test-shard.ts splits the
  # suite. This list is checked against it by scripts/test-shard.test.ts —
  # change one and the other fails.
  test:
    name: Test (shard ${{ matrix.shard }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Set up Bun
        if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Test suite
        if: needs.changes.outputs.code == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: bun run test:shard "$SHARD" "4"
