name: Set up Bun project
description: Install the repository's pinned Bun version and dependencies

inputs:
  bun-version:
    description: Bun version to install
    default: "1.3.1"

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
